name: "Vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    # any changes that happens here will trigger the pipeline
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-1
  EKS_CLUSTER: mihaiops-eks
# stage eq on gitlab
jobs:
  terraform:
    name: "Apply terraform code changes"
    # runners like in gitlab
    runs-on: ubuntu-latest
    # defaults workdir, shell, etc
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    # jobs eq on gitlab
    steps:
      - name: Checkout source code
        #github.com/marketplace -> for predefined modules
        uses: actions/checkout@v4

      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v2
        # with:
        #   terraform_version: "1.1.7"
      
      - name: Terraform init
        # id is different from name. id can be referenced by other tasks
        id: init
        # exec command
        run: terraform init -backend-config="bucket=$BUCKET_TF_STATE"

      - name: Terraform format
        id: fmt
        run: terraform fmt -check

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true

      - name: Terraform plan status
        # condition based on id of other step
        if: steps.plan.outcome == 'failure'
        run: exit 1